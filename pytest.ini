[pytest]
# 只收集 tests/：不要去扫项目根目录
testpaths = tests

# 这台机器的安全软件会拦 pytest 建缓存目录（.pytest_cache 的"临时目录+改名"
# 那一步被拒），留下无法读取也无法删除的 pytest-cache-files-* 垃圾目录，
# 而下次收集时 scandir 它们会直接报错。所以干脆关掉缓存插件。
# 代价：--lf / --ff（只重跑上次失败的）不能用了。
addopts = -p no:cacheprovider

# 万一有人显式传了路径，也别往这些目录里钻
norecursedirs = .* build dist *.egg node_modules pytest-cache-files-* __pycache__

# 让 pytest 也能 import 到 snake_rl（等价于 python -m pytest 的效果），
# 这样直接敲 pytest 也能用
pythonpath = .
